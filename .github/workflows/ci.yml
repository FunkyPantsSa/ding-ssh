name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test
        run: go test ./internal/...

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # 可下载的编译产物：仅在 main / dev 分支 push 时构建，供测试同学直接取包。
  # 只做「构建 + 上传 artifact」，不涉及 Release / 发布（发布仍由 release.yml 在 tag 上执行）。
  build-artifacts:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [go-test, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
          - os: macos-latest
            platform: darwin/universal
            artifact: macos-universal
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      WAILS_CLI_VERSION: v2.13.0
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          sha="${GITHUB_SHA::7}"
          echo "app_version=0.0.0-dev.${sha}" >> "$GITHUB_OUTPUT"
          echo "wails_version=0.0.0" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}

      - name: Stamp product version
        shell: bash
        env:
          WAILS_VERSION: ${{ steps.ver.outputs.wails_version }}
        run: python3 scripts/set-version.py || python scripts/set-version.py

      - name: Wails build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Wails build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} -webview2 embed

      - name: Wails build (macOS)
        if: runner.os == 'macOS'
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # 名字里带上分支与 commit，方便测试按分支下载对应的包
          name: ding-ssh-${{ github.ref_name }}-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            build/bin/*
            dist/*
          if-no-files-found: error
