name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - name: Test
        run: go test ./internal/...

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # 可下载的编译产物：仅在 main / dev 分支 push 时构建，供测试同学直接取包。
  # 分支构建同时发布独立的更新通道；正式版本仍由 release.yml 在 tag 上发布。
  build-artifacts:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [go-test, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux-amd64
          - os: windows-latest
            platform: windows/amd64
            artifact: windows-amd64
          - os: macos-latest
            platform: darwin/arm64
            artifact: macos-arm64
            macos_arch: arm64
          - os: macos-latest
            platform: darwin/amd64
            artifact: macos-amd64
            macos_arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      WAILS_CLI_VERSION: v2.13.0
      APP_VERSION: 0.0.0-${{ github.ref_name }}.${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          sha="${GITHUB_SHA::7}"
          echo "app_version=0.0.0-dev.${sha}" >> "$GITHUB_OUTPUT"
          echo "wails_version=0.0.0" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}

      - name: Stamp product version
        shell: bash
        env:
          WAILS_VERSION: ${{ steps.ver.outputs.wails_version }}
        run: python3 scripts/set-version.py || python scripts/set-version.py

      - name: Wails build (Linux)
        if: runner.os == 'Linux'
        run: wails build -ldflags "-X ding-ssh/internal/updater.BuildChannel=${{ github.ref_name }} -X ding-ssh/internal/updater.BuildCommit=${{ github.sha }}" -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Wails build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: wails build -ldflags "-X ding-ssh/internal/updater.BuildChannel=${{ github.ref_name }} -X ding-ssh/internal/updater.BuildCommit=${{ github.sha }}" -clean -platform ${{ matrix.platform }} -webview2 embed

      - name: Wails build (macOS)
        if: runner.os == 'macOS'
        run: wails build -ldflags "-X ding-ssh/internal/updater.BuildChannel=${{ github.ref_name }} -X ding-ssh/internal/updater.BuildCommit=${{ github.sha }}" -clean -platform ${{ matrix.platform }}

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGE_TOOL=/tmp/appimagetool APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/package-linux.sh

      - name: Package update archive
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent build/bin/ding-ssh.app "dist/ding-ssh-${GITHUB_SHA}-macos-${{ matrix.macos_arch }}.app.zip" ;;
            Windows) powershell.exe -NoProfile -Command "Compress-Archive -Path build/bin/ding-ssh.exe -DestinationPath dist/ding-ssh-${GITHUB_SHA}-windows-amd64.zip" ;;
            Linux) tar -C build/bin -czf "dist/ding-ssh-${GITHUB_SHA}-linux-amd64.tar.gz" ding-ssh ;;
          esac

      - name: Upload update archives
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.artifact }}
          path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # 名字里带上分支与 commit，方便测试按分支下载对应的包
          name: ding-ssh-${{ github.ref_name }}-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            build/bin/*
            dist/*
          if-no-files-found: error

  publish-update:
    name: Publish branch update
    needs: build-artifacts
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          path: dist
          merge-multiple: true
      - name: Generate manifest
        env:
          UPDATE_CHANNEL: ${{ github.ref_name }}
        run: python3 scripts/update-manifest.py
      - name: Publish branch release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_CHANNEL: ${{ github.ref_name }}
        shell: bash
        run: |
          tag="${UPDATE_CHANNEL}-latest"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "${UPDATE_CHANNEL} builds" --target "$GITHUB_SHA" --notes "Automatic branch builds."
          gh release upload "$tag" dist/* --clobber
