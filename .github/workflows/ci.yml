name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache APT packages
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-cache-ubuntu-24.04-gtk3
          restore-keys: |
            apt-cache-ubuntu-24.04-gtk3
      - name: Linux WebKitGTK
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo tee /etc/apt/apt.conf.d/99custom-optimizations << 'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Languages "none";
          Acquire::http::Timeout "10";
          Acquire::Retries "3";
          Acquire::http::Pipeline-Depth "5";
          Acquire::PDiffs "false";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          EOF
          mkdir -p ~/.apt-cache
          if ls ~/.apt-cache/*.deb 1> /dev/null 2>&1; then
            echo "Installing APT packages from cache..."
            sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo dpkg -i ~/.apt-cache/*.deb || sudo apt-get install -y --fix-broken --no-install-recommends
          else
            echo "Cache miss, updating apt and downloading packages..."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              libgtk-3-dev libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev librsvg2-dev
            cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
          fi
      - name: Test
        run: go test -tags gtk3 ./internal/... ./cmd/...

  frontend:
    name: Frontend typecheck
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  # 可下载的编译产物：仅在 main / dev 分支 push 时构建，供测试同学直接取包。
  # 分支构建同时发布独立的更新通道；正式版本仍由 release.yml 在 tag 上发布。
  build-artifacts:
    name: Build ${{ matrix.artifact }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    needs: [go-test, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            artifact: linux-amd64
          - os: windows-latest
            arch: amd64
            artifact: windows-amd64
          - os: macos-latest
            arch: arm64
            artifact: macos-arm64
            macos_arch: arm64
    runs-on: ${{ matrix.os }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      WAILS_CLI_VERSION: v3.1.0
      APP_VERSION: 0.0.0-${{ github.ref_name }}.${{ github.sha }}
      SKIP_FRONTEND: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Download frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure Windows Defender exclusion
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          sha="${GITHUB_SHA::7}"
          echo "app_version=0.0.0-dev.${sha}" >> "$GITHUB_OUTPUT"
          echo "wails_version=0.0.0" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache APT packages
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: ~/.apt-cache
          key: apt-cache-ubuntu-24.04-gtk3
          restore-keys: |
            apt-cache-ubuntu-24.04-gtk3

      - name: Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          sudo tee /etc/apt/apt.conf.d/99custom-optimizations << 'EOF'
          Acquire::ForceIPv4 "true";
          Acquire::Languages "none";
          Acquire::http::Timeout "10";
          Acquire::Retries "3";
          Acquire::http::Pipeline-Depth "5";
          Acquire::PDiffs "false";
          Binary::apt::APT::Keep-Downloaded-Packages "true";
          EOF
          mkdir -p ~/.apt-cache
          if ls ~/.apt-cache/*.deb 1> /dev/null 2>&1; then
            echo "Installing APT packages from cache..."
            sudo cp -n ~/.apt-cache/*.deb /var/cache/apt/archives/ 2>/dev/null || true
            sudo dpkg -i ~/.apt-cache/*.deb || sudo apt-get install -y --fix-broken --no-install-recommends
          else
            echo "Cache miss, updating apt and downloading packages..."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              build-essential pkg-config \
              libgtk-3-dev libwebkit2gtk-4.1-dev \
              libayatana-appindicator3-dev librsvg2-dev
            cp -n /var/cache/apt/archives/*.deb ~/.apt-cache/ 2>/dev/null || true
          fi

      - name: Cache Wails CLI
        id: cache-wails
        uses: actions/cache@v4
        with:
          path: |
            ~/go/bin/wails3
            ~/go/bin/wails3.exe
          key: wails-cli-${{ runner.os }}-${{ env.WAILS_CLI_VERSION }}

      - name: Install Wails CLI
        if: steps.cache-wails.outputs.cache-hit != 'true'
        shell: bash
        # The Linux CLI also links against WebKitGTK at build time.
        env:
          GOFLAGS: ${{ runner.os == 'Linux' && '-tags=gtk3' || '' }}
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${WAILS_CLI_VERSION}

      - name: Ensure Wails CLI executable
        if: runner.os != 'Windows'
        shell: bash
        run: chmod +x ~/go/bin/wails3 || true

      - name: Stamp product version
        shell: bash
        env:
          WAILS_VERSION: ${{ steps.ver.outputs.wails_version }}
        run: python3 scripts/set-version.py || python scripts/set-version.py

      - name: Wails build (Linux)
        if: runner.os == 'Linux'
        run: wails3 task build GOOS=linux ARCH=${{ matrix.arch }} TARGET_ARCH=${{ matrix.arch }} TARGET_OS=linux BUILD_COMMIT=${{ github.sha }} BUILD_CHANNEL=${{ github.ref_name }} SKIP_FRONTEND=true

      - name: Windows updater tests
        if: runner.os == 'Windows'
        run: go test ./internal/updater

      - name: Wails build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: wails3 task build GOOS=windows ARCH=${{ matrix.arch }} TARGET_ARCH=${{ matrix.arch }} TARGET_OS=windows BUILD_COMMIT=${{ github.sha }} BUILD_CHANNEL=${{ github.ref_name }} SKIP_FRONTEND=true

      - name: Wails build (macOS)
        if: runner.os == 'macOS'
        run: wails3 task build GOOS=darwin ARCH=${{ matrix.arch }} TARGET_ARCH=${{ matrix.arch }} TARGET_OS=darwin BUILD_COMMIT=${{ github.sha }} BUILD_CHANNEL=${{ github.ref_name }} SKIP_FRONTEND=true

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        env:
          APP_VERSION: ${{ github.sha }}
        run: |
          curl -fsSL -o /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          APPIMAGE_TOOL=/tmp/appimagetool APPIMAGE_EXTRACT_AND_RUN=1 bash scripts/package-linux.sh

      - name: Package update archive
        shell: bash
        run: |
          mkdir -p dist
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent build/bin/ding-ssh.app "dist/ding-ssh-${GITHUB_SHA}-macos-${{ matrix.macos_arch }}.app.zip" ;;
            Windows) powershell.exe -NoProfile -Command "Compress-Archive -Path build/bin/ding-ssh.exe -DestinationPath dist/ding-ssh-${GITHUB_SHA}-windows-amd64.zip" ;;
            Linux) tar -C build/bin -czf "dist/ding-ssh-${GITHUB_SHA}-linux-amd64.tar.gz" ding-ssh ;;
          esac

      - name: Upload update archives
        uses: actions/upload-artifact@v4
        with:
          name: update-${{ matrix.artifact }}
          path: dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          # 名字里带上分支与 commit，方便测试按分支下载对应的包
          name: ding-ssh-${{ github.ref_name }}-${{ matrix.artifact }}-${{ github.sha }}
          path: |
            build/bin/*
            dist/*
          if-no-files-found: error

  publish-update:
    name: Publish branch update
    needs: build-artifacts
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: update-*
          path: dist
          merge-multiple: true
      - name: Generate manifest
        env:
          UPDATE_CHANNEL: ${{ github.ref_name }}
        run: python3 scripts/update-manifest.py
      - name: Publish branch release
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_CHANNEL: ${{ github.ref_name }}
        shell: bash
        run: |
          tag="${UPDATE_CHANNEL}-latest"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --prerelease --title "${UPDATE_CHANNEL} builds" --target "$GITHUB_SHA" --notes "Automatic branch builds."
          gh release upload "$tag" dist/* --clobber
