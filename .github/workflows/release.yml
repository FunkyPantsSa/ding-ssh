name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  NODE_OPTIONS: --max-old-space-size=4096
  WAILS_CLI_VERSION: v2.13.0

jobs:
  test:
    name: Preflight tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go tests
        run: go test ./internal/...
      - name: Frontend typecheck
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build:
    name: Build ${{ matrix.artifact }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/universal
            artifact: macos
          - os: windows-latest
            platform: windows/amd64
            artifact: windows
          - os: ubuntu-24.04
            platform: linux/amd64
            artifact: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            raw="${GITHUB_REF_NAME#v}"
            echo "app_version=${raw}" >> "$GITHUB_OUTPUT"
            echo "wails_version=${raw}" >> "$GITHUB_OUTPUT"
            echo "nfpm_version=${raw}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            sha="${GITHUB_SHA::7}"
            echo "app_version=0.0.0-dev.${sha}" >> "$GITHUB_OUTPUT"
            echo "wails_version=0.0.0" >> "$GITHUB_OUTPUT"
            echo "nfpm_version=0.0.0+dev.${sha}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Linux WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Windows NSIS
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files (x86)\NSIS"
          Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\NSIS"

      - name: Install Wails CLI
        shell: bash
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_CLI_VERSION}

      - name: Stamp product version
        shell: bash
        env:
          WAILS_VERSION: ${{ steps.ver.outputs.wails_version }}
        run: python3 scripts/set-version.py || python scripts/set-version.py

      - name: Wails build (macOS)
        if: runner.os == 'macOS'
        run: wails build -clean -platform ${{ matrix.platform }}

      - name: Wails build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: wails build -clean -platform ${{ matrix.platform }} -nsis -webview2 embed

      - name: Wails build (Linux)
        if: runner.os == 'Linux'
        run: wails build -clean -platform ${{ matrix.platform }} -tags webkit2_41

      - name: Package macOS
        if: runner.os == 'macOS'
        env:
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh

      - name: Package Windows
        if: runner.os == 'Windows'
        env:
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
        run: pwsh -File scripts/package-windows.ps1

      - name: Package Linux
        if: runner.os == 'Linux'
        env:
          APP_VERSION: ${{ steps.ver.outputs.app_version }}
          NFPM_VERSION: ${{ steps.ver.outputs.nfpm_version }}
        run: |
          chmod +x scripts/package-linux.sh
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.40.0
          curl -fsSL -o /tmp/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x /tmp/appimagetool
          export APPIMAGE_TOOL=/tmp/appimagetool
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./scripts/package-linux.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ding-ssh-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ding-ssh ${{ github.ref_name }}
          files: dist/*
          body: |
            ## 下载

            | 平台 | 文件 |
            | --- | --- |
            | macOS (Universal) | `ding-ssh-*-macos-universal.dmg` / `.app.zip` |
            | Windows x64 | `ding-ssh-*-windows-amd64-setup.exe` / `.zip` |
            | Linux x64 | `.AppImage` / `.deb` / `.tar.gz` |

            macOS 未签名：首次打开请在 Finder 中右键 → 打开。
            Linux 需已安装 `libgtk-3-0` 与 `libwebkit2gtk-4.1-0`（`.deb` 会声明依赖）。
            校验：`SHA256SUMS.txt`。
